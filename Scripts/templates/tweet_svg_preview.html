            color: var(--text-main);

            padding: 10px 18px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .btn-primary {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(29, 155, 240, 0.35);
        }

        .btn-primary:hover {
            background: var(--accent-blue-hover);
            border-color: var(--accent-blue-hover);
        }

        main {
            flex: 1;
            display: grid;
            grid-template-columns: 440px 1fr;
            gap: 24px;
            padding: 24px 32px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-lg);
            backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-body {
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], select, textarea {
            background: var(--input-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, select:focus, textarea:focus {
            border-color: var(--accent-blue);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .tab-bar {
            display: flex;
            gap: 4px;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px;
            border-radius: 8px;
        }

        .tab-btn {
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--input-bg);
            color: var(--text-main);
        }

        .preview-canvas-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background: radial-gradient(circle at center, rgba(29, 155, 240, 0.05) 0%, rgba(0, 0, 0, 0.4) 100%);
            min-height: 520px;
            position: relative;
        }

        .svg-wrapper {
            max-width: 600px;
            width: 100%;
            transition: transform 0.3s ease;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border-radius: 16px;

        .code-container {

            color: #d4d4d4;
            overflow-x: auto;
            white-space: pre-wrap;
            max-height: 480px;
        }

        .hidden {

            document.getElementById('input-handle').value = p.handle;
            document.getElementById('input-avatar').value = p.avatar;
            document.getElementById('input-text').value = p.text;
            document.getElementById('input-media').value = p.media;
            document.getElementById('input-date').value = p.date;
            document.getElementById('input-replies').value = p.replies;
            document.getElementById('input-reposts').value = p.reposts;
            document.getElementById('input-likes').value = p.likes;
            document.getElementById('input-views').value = p.views;
            updateSvg();
        }

        function updateSvg() {
            const name = document.getElementById('input-name').value;
            const handle = document.getElementById('input-handle').value;
            const avatar = document.getElementById('input-avatar').value;
            const text = document.getElementById('input-text').value;
            const media = document.getElementById('input-media').value;
            const date = document.getElementById('input-date').value;
            const replies = document.getElementById('input-replies').value;
            const reposts = document.getElementById('input-reposts').value;
            const likes = document.getElementById('input-likes').value;
            const views = document.getElementById('input-views').value;

            const approxWidth = Math.min(name.length * 9.5, 380);
            const verifiedX = 88 + Math.round(approxWidth);

            const mediaSection = media ? `<g id="media-card">
    <rect x="24" y="186" width="552" height="200" rx="14" ry="14" fill="#16181C" stroke="#2F3336" stroke-width="1"/>
    <image href="${escapeXml(media)}" x="24" y="186" width="552" height="200" clip-path="url(#media-clip)" preserveAspectRatio="xMidYMid slice"/>
  </g>` : '<!-- No Media -->';

            const outputSvg = SVG_TEMPLATE
                .replace(/\{\{DISPLAY_NAME\}\}/g, escapeXml(name))
                .replace(/\{\{HANDLE\}\}/g, escapeXml(handle))
                .replace(/\{\{AVATAR_URL\}\}/g, escapeXml(avatar))
                .replace(/\{\{TWEET_TEXT\}\}/g, escapeXml(text))
                .replace(/\{\{MEDIA_SECTION\}\}/g, mediaSection)
                .replace(/\{\{DATE\}\}/g, escapeXml(date))
                .replace(/\{\{VERIFIED_X\}\}/g, verifiedX)
                .replace(/\{\{REPLIES\}\}/g, escapeXml(replies))
                .replace(/\{\{REPOSTS\}\}/g, escapeXml(reposts))
                .replace(/\{\{LIKES\}\}/g, escapeXml(likes))
                .replace(/\{\{VIEWS\}\}/g, escapeXml(views));

            document.getElementById('svg-container').innerHTML = outputSvg;
            document.getElementById('code-output').textContent = outputSvg;
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (tab === 'editor') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-editor').classList.remove('hidden');
                document.getElementById('tab-code').classList.add('hidden');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-editor').classList.add('hidden');
                document.getElementById('tab-code').classList.remove('hidden');
            }
        }

        function copySvgCode() {
            const code = document.getElementById('code-output').textContent;
            navigator.clipboard.writeText(code);
            alert('SVG code copied to clipboard!');
        }

        function downloadSvg() {
            const code = document.getElementById('code-output').textContent;
            const blob = new Blob([code], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'tweet_template.svg';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        window.onload = updateSvg;
    </script>
</body>
</html>
